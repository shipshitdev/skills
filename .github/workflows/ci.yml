name: CI

on:
  # No path filter: `checks` is a required status on master, so every PR must
  # produce it or the merge button stays blocked on "expected" forever.
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Validate skills
        run: bun run validate

      - name: Test validator and skill scripts
        run: bun run test

      - name: Audit dependencies
        # GHSA-g3hv-75wg-m249: minimatch <11.0.1 via markdownlint-cli, a dev-only
        # lint tool fed our own globs. Drop the ignore once markdownlint-cli
        # depends on minimatch 11.
        run: bun audit --ignore GHSA-g3hv-75wg-m249
