name: Release Please

# Every push to master feeds a rolling "chore(master): release X.Y.Z" PR that
# bumps package.json + CHANGELOG.md from conventional-commit PR titles.
# Every release is a patch bump, including feat and ! commits
# (`versioning: always-bump-patch`). It opens as a draft
# (`draft-pull-request` in release-please-config.json) because it accumulates
# every merge until someone decides to cut a release — mark it ready for
# review when that moment comes. Merging it cuts the vX.Y.Z tag and release.
#
# Runs on the built-in GITHUB_TOKEN — no PAT to provision or rotate. The
# tradeoff: GitHub queues the release PR's CI at `action_required` instead of
# running it, so `checks` — required on master — needs one "Approve and run"
# click per release before the PR can merge. Dispatching CI on the branch
# instead does NOT help: that check run attaches to the head SHA but never
# enters the PR's status rollup, so protection still sees the check as missing.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release PR bumps package.json, and bundle/marketplace versions are
  # generated from it; canonical skill/plugin versions are synchronized too.
  # Regenerate on the release branch so CI's
  # "Verify generated bundles are current" gate stays green.
  sync-generated:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate catalog, bundles, and marketplace
        run: bun run marketplace:generate

      - name: Commit regenerated files
        run: |
          if git diff --quiet; then
            echo "Generated files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate bundles for release"
          git push
